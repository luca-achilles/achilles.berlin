services:
  achilles-berlin:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-bun-image
    container_name: achilles-berlin-container
    labels:
      - traefik.enable=true
      - traefik.http.routers.achilles-berlin.rule=Host(`achilles.berlin`)
      - traefik.http.routers.achilles-berlin.entrypoints=websecure
      - traefik.http.routers.achilles-berlin.tls.certresolver=lets-encrypt
      - traefik.http.services.achilles-berlin.loadbalancer.server.port=8080
      - traefik.docker.network=web
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(''http://localhost:8080/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - web
    environment:
      NODE_ENV: production
      PORT: '8080'
    restart: unless-stopped

networks:
  web:
    external: true
